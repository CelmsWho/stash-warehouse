<%- include('partials/head.html', { title: 'Sākums' }) %>
<body class="app">
  <%- include('partials/sidebar.html') %>
  <main class="main">
    <header class="page-head">
      <h1>Sveiks, <%= user.username %></h1>
      <span class="stamp"><%= roleNames[user.role] %></span>
    </header>

    <div class="home">
      <section class="tiles">
        <h2>Ātrās darbības</h2>
        <% menu.forEach(function(m){ %>
          <a class="tile" href="<%= m.path %>"><%= m.label %></a>
        <% }) %>
      </section>
    </div>
  </main>
</body>
</html>
