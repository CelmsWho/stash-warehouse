<aside class="side">
  <div class="tape"></div>
  <a class="brand" href="/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29V13L16 4l13 9v16h-5V15L16 9.5 8 15v14z" fill="currentColor"/><rect x="11" y="17" width="10" height="3" fill="currentColor"/><rect x="11" y="22" width="10" height="3" fill="currentColor"/></svg>
    <span>STASH</span>
  </a>
  <nav>
    <a href="/" class="<%= currentPath === '/' ? 'on' : '' %>">Sākums</a>
    <% menu.forEach(function(m){ %>
      <a href="<%= m.path %>" class="<%= currentPath === m.path ? 'on' : '' %>"><%= m.label %></a>
    <% }) %>
  </nav>
  <form method="post" action="/logout" class="out">
    <input type="hidden" name="_csrf" value="<%= csrf %>">
    <div class="who"><%= user.username %> <small><%= roleNames[user.role] %></small></div>
    <button type="submit">Iziet</button>
  </form>
</aside>
