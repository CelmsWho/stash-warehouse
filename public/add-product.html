<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pievienot produktu | STASH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;900&family=Special+Elite&family=Archivo:wght@400;600&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <header class="page-head"><h1>Pievienot produktu</h1></header>

      <div class="add">
        <form id="productForm" class="form-card">
          <div id="formMsg" class="alert hidden" role="status"></div>

          <div class="row2">
            <div class="field" id="f-sku">
              <label for="sku">Artikula kods</label>
              <input id="sku" name="sku" type="text" required minlength="3"
                maxlength="32" pattern="[A-Za-z0-9_\-]+" autocomplete="off">
              <p class="err" data-err="sku"></p>
            </div>
            <div class="field" id="f-category">
              <label for="category">Kategorija</label>
              <input id="category" name="category" type="text" maxlength="50">
              <p class="err" data-err="category"></p>
            </div>
          </div>

          <div class="field" id="f-name">
            <label for="name">Nosaukums</label>
            <input id="name" name="name" type="text" required minlength="2"
              maxlength="100">
            <p class="err" data-err="name"></p>
          </div>

          <div class="row2">
            <div class="field" id="f-quantity">
              <label for="quantity">Daudzums</label>
              <input id="quantity" name="quantity" type="number" value="0"
                required min="0" max="1000000" step="1">
              <p class="err" data-err="quantity"></p>
            </div>
            <div class="field" id="f-price">
              <label for="price">Cena (EUR)</label>
              <input id="price" name="price" type="text" inputmode="decimal"
                required>
              <p class="err" data-err="price"></p>
            </div>
          </div>

          <div class="field" id="f-description">
            <label for="description">Apraksts</label>
            <textarea id="description" name="description" rows="4"
              maxlength="500"></textarea>
            <p class="err" data-err="description"></p>
          </div>

          <button type="submit" class="submit">Saglabāt produktu</button>
        </form>

        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 420 260">
            <ellipse cx="215" cy="226" rx="175" ry="17"
              fill="rgba(0,0,0,.55)" />
            <g transform="rotate(-6 150 150)">
              <rect x="52" y="86" width="196" height="116" rx="6"
                fill="#c9a56a" />
              <rect x="52" y="86" width="196" height="116" rx="6" fill="none"
                stroke="#8f7036" stroke-width="2" />
              <rect x="136" y="86" width="30" height="116"
                fill="rgba(240,230,195,.72)" />
              <rect x="52" y="134" width="196" height="22"
                fill="rgba(240,230,195,.72)" />
              <rect x="64" y="96" width="62" height="30" fill="#f3ead2"
                stroke="#141414" stroke-width="1.5" />
              <text x="95" y="117" text-anchor="middle"
                font-family="'Big Shoulders Stencil', Impact, sans-serif"
                font-size="18" font-weight="900" fill="#141414">STASH</text>
              <path d="M232 86 L248 86 L248 104 Z" fill="#161918" />
            </g>
            <path
              d="M222 214 C238 176 282 152 326 172 C358 186 374 204 378 216 C338 228 262 228 222 214 Z"
              fill="#f4f4ef" />
            <path
              d="M250 196 C268 172 300 166 326 178 C300 180 276 190 250 196 Z"
              fill="#ffffff" opacity=".9" />
            <path
              d="M296 218 C330 220 360 216 378 216 C360 224 322 228 296 218 Z"
              fill="#cfcfc4" />
            <g fill="#f4f4ef">
              <circle cx="206" cy="222" r="2.2" /><circle cx="392" cy="220"
                r="2" />
              <circle cx="388" cy="226" r="1.6" /><circle cx="200" cy="214"
                r="1.6" />
            </g>
          </svg>
        </div>
      </div>
    </main>
    <script src="/auth.js"></script>
    <script src="/add-product.js"></script>
  </body>
</html>
